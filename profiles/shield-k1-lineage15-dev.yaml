schema_version: 1
profile: shield-k1-lineage15-dev
lineage:
  branch: lineage-15.1
  repo_url: https://github.com/LineageOS/android.git
  sync_jobs: 16
  extra_projects:
  - name: LineageOS/android_device_nvidia_shieldtablet
    path: device/nvidia/shieldtablet
    remote: github
    revision: lineage-15.1
  - name: LineageOS/android_device_nvidia_shield-common
    path: device/nvidia/shield-common
    remote: github
    revision: lineage-15.1
  - name: LineageOS/android_kernel_nvidia_shield
    path: kernel/nvidia/shield
    remote: github
    revision: lineage-15.1
android:
  api_level: 27
  abi: armeabi-v7a
system:
  ui_night_mode: 'yes'
targets:
  tablet:
    device: shieldtablet
    lunch: lineage_shieldtablet-userdebug
    output_product: shieldtablet
    product_makefile: device/nvidia/shieldtablet/lineage.mk
    build_command: mka bacon
  emulator:
    lunch: sdk_phone_x86-userdebug
    output_product: generic_x86
    product_makefile: build/make/target/product/sdk_phone_x86.mk
    build_command: WITHOUT_CHECK_API=true mka
apps:
  home_assistant:
    module: HomeAssistantMinimal
    package: io.homeassistant.companion.android.minimal
    apk: inputs/apks/HomeAssistantMinimal.apk
    sha256: 54a3d3ebae1841d9b2724aa781b79eec3fcb5f8114661d1aaba32b2b944f76f0
    version: 2026.4.4-minimal
    version_code: 21576
    min_sdk: 23
    abi: armeabi-v7a
  browser:
    module: FennecFdroid
    package: org.mozilla.fennec_fdroid
    apk: inputs/apks/FennecFdroid.apk
    sha256: ac2ba44a0e3051d5f3d4e74e8471f3c9eb728868d0e628edfd3added5519065b
    version: 150.0.3
    version_code: 1500300
    min_sdk: 26
    abi: armeabi-v7a
  emulator_browser:
    module: PrivacyBrowser
    package: com.stoutner.privacybrowser.standard
