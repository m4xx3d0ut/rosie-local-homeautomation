    sha256: 543f90e2e0adfc25059ed0c9bbaefbddcb33bd966caa23df7ada3441ecef1d5b
    version: 3.19.2
    version_code: 78
    min_sdk: 26
    abi: x86
kiosk:
  launcher:
    module: RosieKioskLauncher
    package: local.rosie.kiosk
  theme:
    title: Rosie Kiosk
    subtitle: Home Assistant and browser access
    font_family: sans
    background:
      type: color
      fit: cover
      loop: true
      fallback_color: '#0f1216'
      scrim_color: '#00000000'
    text:
      color: '#ffffff'
      subtitle_color: '#bec6cd'
      title_size_sp: 34
      subtitle_size_sp: 18
      shadow_color: '#99000000'
      shadow_radius_dp: 2
      shadow_dx_dp: 0
      shadow_dy_dp: 2
    buttons:
      home_assistant_label: Home Assistant
      browser_label: Browser
      background_color: '#00a884'
      text_color: '#ffffff'
      accent_color: '#007c61'
      border_color: '#00a884'
      focus_border_color: '#007c61'
      text_size_sp: 22
      radius_dp: 6
      min_height_dp: 68
      width_dp: 520
  remove_modules:
  - AudioFX
  - Eleven
  - Home
  - Jelly
  - Launcher2
  - Launcher3
  - LineageParts
  - LineageSetupWizard
  - LockClock
  - Profiles
  - Recorder
  - Snap
  - Trebuchet
  - Updater
  remove_packages:
  - org.lineageos.audiofx
  - org.lineageos.eleven
  - org.lineageos.jelly
  - org.lineageos.lineageparts
  - org.lineageos.lockclock
  - org.lineageos.profiles
  - org.lineageos.recorder
  - org.lineageos.setupwizard
  - org.lineageos.snap
  - org.lineageos.trebuchet
  - org.lineageos.updater
blobs:
  archive: inputs/vendor-blobs/vendor-nvidia-shieldtablet-lineage15.tar.zst
  sha256: a93922c7a2989dc7b0d06ecfcfa5c517357b5e81b3f1a123f9622d45e8117fb7
validation:
  home_assistant: launch-only
  emulator_policy: companion-image
  use_sdk_emulator: true
  no_gms_packages:
  - com.google.android.gms
  - com.android.vending
  boot_timeout_seconds: 600
device:
  expected_device: shieldtablet
  serial: null
  vendor_id: null
deployment:
  mode: recovery_sideload
  destructive_flags_required: true
  boot_timeout_seconds: 600
  post_flash_timeout_seconds: 900
paths:
  android_root: .work/android-lineage15
  ccache: .work/ccache-lineage15
  dist: dist
runner:
  image: rosie-local-ha/android-runner:lineage15
  dockerfile: container/lineage15/Dockerfile
  cpus: 24
  memory: 48Gi
output:
  artifact_name: shield-k1-ha-kiosk-lineage15
