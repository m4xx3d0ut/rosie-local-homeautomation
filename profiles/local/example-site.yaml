# Copy to profiles/local/site.yaml and replace private values before building.
debug:
  root_access: adb
  adb_public_key: inputs/adb/host-adbkey.pub
system:
  ui_night_mode: auto
  # Optional root-backed keyboard theme; requires debug.root_access: adb.
  # keyboard_theme: dark
# Optional root-backed browser runtime defaults; requires debug.root_access: adb.
# apps:
#   browser:
#     runtime_defaults:
#       theme: dark
#       website_color_scheme: dark
# To isolate Home Assistant tabs from general browsing, add an optional
# apps.home_assistant_browser entry that points at a second browser APK.
kiosk:
  launch:
    home_assistant_url: http://homeassistant.local:8123/
    browser_url: https://duckduckgo.com/
  theme:
    title: Local Home
    subtitle: Kitchen, lights, climate, and camera controls
    font_family: sans-serif
    background:
      type: image
      path: inputs/kiosk-assets/site-background.png
      sha256: REPLACE_WITH_BACKGROUND_SHA256
      fit: cover
      loop: true
      fallback_color: '#121212'
      scrim_color: '#B8070A0E'
    text:
      color: '#e5e7eb'
      subtitle_color: '#9ca3af'
      title_size_sp: 38
      subtitle_size_sp: 18
      shadow_color: '#B8000000'
      shadow_radius_dp: 3
      shadow_dx_dp: 0
      shadow_dy_dp: 2
    buttons:
      home_assistant_label: Home Assistant
      browser_label: Browser
      background_color: '#CC2c2c2c'
      text_color: '#e5e7eb'
      accent_color: '#33fbc02d'
      border_color: '#99404040'
      focus_border_color: '#fbc02d'
      text_size_sp: 22
      radius_dp: 8
      min_height_dp: 72
      width_dp: 560
